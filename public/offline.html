<!doctype html>
<html lang="pt-BR">
  <head>

    <title>Sem conexão — Bible Habit</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #05050f; color: #f4f4f7; padding: 24px;
        font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card { max-width: 26rem; }
      img { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 20px; }
      h1 { font-size: 1.35rem; margin: 0 0 10px; }
      p { margin: 0 0 22px; line-height: 1.6; color: #b7b7c6; font-size: 0.95rem; }
      button {
        border: 0; cursor: pointer; padding: 0 22px; height: 44px; border-radius: 999px;
        font-size: 0.95rem; font-weight: 600; color: #fff;
        background: linear-gradient(135deg, #6d5efc, #a855f7);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="Bible Habit" />
      <h1>Você está sem conexão</h1>
      <p>
        Não foi possível carregar esta página agora. Verifique sua internet e tente novamente —
        seus registros já salvos continuam guardados.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
